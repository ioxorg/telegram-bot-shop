name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Import smoke-test
        run: |
          uv run python - <<'EOF'
          import app.db
          import app.repo.users, app.repo.orders
          import app.repo.plans, app.repo.bot_settings
          print("imports OK")
          EOF
        env:
          BOT_TOKEN: "fake:token"
          ADMIN_TELEGRAM_ID: "123"
          MARZBAN_BASE_URL: "http://localhost"
          MARZBAN_USERNAME: "test"
          MARZBAN_PASSWORD: "test"

      - name: SQLite init + query smoke-test
        run: |
          uv run python - <<'EOF'
          import asyncio
          from app.db import init_db, get_db
          from app.repo.users import count_users
          from app.repo.plans import get_all_plans
          from app.repo.orders import count_approved, total_revenue
          from app.repo.bot_settings import get_payment_settings

          async def run():
              await init_db()
              async with get_db() as db:
                  assert isinstance(await count_users(db), int)
                  assert isinstance(await count_approved(db), int)
                  assert isinstance(await total_revenue(db), int)
                  assert isinstance(await get_all_plans(db), list)
                  ps = await get_payment_settings(db)
                  assert "card_payment_enabled" in ps
              print("DB smoke-test OK")

          asyncio.run(run())
          EOF
        env:
          BOT_TOKEN: "fake:token"
          ADMIN_TELEGRAM_ID: "123"
          MARZBAN_BASE_URL: "http://localhost"
          MARZBAN_USERNAME: "test"
          MARZBAN_PASSWORD: "test"
          DB_PATH: "/tmp/ci_test.db"

  # ── Docker build & push ──────────────────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-compilation for non-native arches)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # PRs: pr-<number>
            type=ref,event=pr
            # main branch: edge
            type=edge,branch=main
            # version tags: v1.2.3 → 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always include a short-sha tag for traceability
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push on main/tag pushes; only build (no push) on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Required secrets (Settings → Secrets → Actions):
  #   DEPLOY_HOST      — server IP or hostname
  #   DEPLOY_USER      — SSH username (e.g. ubuntu, root)
  #   DEPLOY_KEY       — private SSH key (add the public key to ~/.ssh/authorized_keys on server)
  #   DEPLOY_PATH      — absolute path to the project dir on server (e.g. /opt/telegram-bot-shop)
  #   DEPLOY_PORT      — SSH port (optional, defaults to 22)
  #   GHCR_TOKEN       — GitHub PAT with read:packages scope (for server to pull the private image)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull new image and restart bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml pull bot
            docker compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml up -d --no-deps --remove-orphans bot
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
