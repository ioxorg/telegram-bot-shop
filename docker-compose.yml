services:
  bot:
    image: ghcr.io/ioxorg/telegram-bot-shop:edge
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite database — only used when DB_BACKEND=sqlite
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: docker.devneeds.ir/postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shopdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - postgres

volumes:
  postgres_data:
