# ── تأیید شماره تلفن ─────────────────────────────────────────────────────────
ask_phone = 📱 <b>یک مرحله دیگر!</b>\n\nبرای استفاده از این سرویس باید شماره تلفن ایرانی خود (+98) را تأیید کنید.\n\nروی دکمه زیر بزنید تا شماره به اشتراک گذاشته شود، یا آن را تایپ کنید (مثال: 09123456789).
