ask_config_name = ابتدا یک نام برای اشتراک خود انتخاب کنید — این نام به عنوان برچسب کانفیگ در کلاینت VPN شما نمایش داده می‌شود.\n\nمثال: <b>خانه</b>، <b>کار</b>، <b>MyWork + CloakNet</b>\n(حداکثر ۳۲ کاراکتر، یا /cancel برای انصراف)
name_too_long = نام خیلی طولانی است (حداکثر ۳۲ کاراکتر). لطفاً نام کوتاه‌تری وارد کنید.
name_taken = ❌ <b>{name}</b> قبلاً استفاده شده. لطفاً نام دیگری انتخاب کنید.
name_set_pay = ✅ نام کانفیگ: <b>{name}</b>\n\n<b>پرداخت کارت به کارت</b>\nلطفاً <b>{price} {currency}</b> برای <b>{plan}</b> به کارت زیر واریز کنید:\n\n<code>{card}</code>\n{bank}\n{holder}\n\nپس از پرداخت، یک <b>عکس</b> واضح از رسید خود ارسال کنید.\nمی‌توانید با /cancel انصراف دهید.
send_photo_reminder = لطفاً <b>عکس</b> رسید پرداخت را ارسال کنید (نه به صورت فایل).
send_text_name = لطفاً یک نام متنی برای کانفیگ‌های خود ارسال کنید.
receipt_received = ✅ رسید دریافت شد. پس از تأیید به شما اطلاع داده می‌شود (معمولاً ظرف چند ساعت).
purchase_cancelled = خرید لغو شد. برای بازگشت به منو /start را بزنید.
