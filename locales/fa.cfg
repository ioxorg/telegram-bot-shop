rep_charge_rejected = ❌ درخواست شارژ شما رد شد.\nدلیل: {reason}\n\nبرای کمک با پشتیبانی تماس بگیرید.
rep_charge_no_card = ❌ اطلاعات پرداخت هنوز تنظیم نشده است. لطفاً با ادمین تماس بگیرید.

