# شارژ حساب
rep_charge_prompt = <b>⚡ شارژ حساب</b>\n\nقیمت هر گیگابایت: <b>{price} {currency}</b>\nموجودی شما: <b>{balance} گیگابایت</b>\n\nچند گیگابایت می‌خواهید شارژ کنید؟ (عدد صحیح، مثلاً ۱۰، ۴۰، ۷۰)\n\nبرای انصراف /cancel بزنید.
