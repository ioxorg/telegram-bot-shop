rep_create_config_start = <b>➕ ساخت کانفیگ</b>\n\nموجودی شما: <b>{balance} گیگابایت</b>\n\nابتدا یک نام برای کانفیگ وارد کنید (حروف انگلیسی، اعداد و آندرلاین · ۳ تا ۳۲ کاراکتر):\n\nبرای انصراف /cancel بزنید.
rep_config_insufficient_balance = ❌ موجودی کافی نیست.\nموجودی شما: <b>{balance} گیگابایت</b>\nحداقل حجم کانفیگ: <b>{min_gb} گیگابایت</b>
rep_ask_gb = ✅ نام تنظیم شد: <b>{name}</b>\n\nحجم این کانفیگ چقدر باشد؟ (<b>{min}–{max} گیگابایت</b>)\nموجودی شما: <b>{balance} گیگابایت</b>
rep_gb_invalid = ❌ لطفاً عددی بین {min} و {max} وارد کنید.
rep_gb_no_balance = ❌ موجودی کافی نیست.\nموجودی شما: <b>{balance} گیگابایت</b>\nدرخواست: <b>{requested} گیگابایت</b>
rep_config_creating = ⏳ در حال ساخت کانفیگ…
rep_config_created = ✅ <b>کانفیگ ساخته شد!</b>\n\nنام: <b>{name}</b>\nحجم: <b>{gb} گیگابایت</b>\nمدت: {days} روز\nموجودی باقیمانده: <b>{balance} گیگابایت</b>\n\n🔗 لینک اشتراک:\n<code>{url}</code>
