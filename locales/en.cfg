# ── Phone verification ────────────────────────────────────────────────────────
ask_phone = 📱 <b>One more step!</b>\n\nTo use this service you need to verify your Iranian phone number (+98).\n\nTap the button below to share it, or type it manually (e.g. 09123456789).
btn_share_phone = 📱 Share my phone number
phone_invalid = ❌ That doesn't look like a valid Iranian number.\n\nPlease share a <b>+98</b> number using the button, or type it (e.g. <code>09123456789</code>).
phone_not_yours = ❌ Please share your own phone number.
phone_verified = ✅ Phone <code>{phone}</code> verified. Welcome!

# ── Purchase flow ─────────────────────────────────────────────────────────────
ask_config_name = First, give your subscription a name — you'll see it as the config label in your VPN client.\n\nExamples: <b>Home</b>, <b>Work</b>, <b>MyWork + CloakNet</b>\n(max 32 characters, or /cancel to abort)
name_too_long = Name too long (max 32 characters). Please try a shorter one.
name_taken = ❌ <b>{name}</b> is already in use. Please choose a different name.
name_set_pay = ✅ Config name set: <b>{name}</b>\n\n<b>Card-to-card payment</b>\nPlease transfer <b>{price} {currency}</b> for <b>{plan}</b> to:\n\n<code>{card}</code>\n{bank}\n{holder}\n\nAfter payment, send a clear <b>photo</b> of your receipt.\nYou can cancel at any time with /cancel.
send_photo_reminder = Please send a <b>photo</b> of the receipt (not as a file).
send_text_name = Please send a text name for your configs.
receipt_received = ✅ Receipt received. We'll notify you once approved (usually within a few hours).
purchase_cancelled = Purchase cancelled. Tap /start to return to the menu.
nothing_to_cancel = Nothing to cancel.

