[project]
name = "marzban-vpn-shop"
maintainer = "Alireza Habibzadeh"
version = "0.1.0"
description = "Telegram bot shop for Marzban VPN subscriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7.0",
    "aiohttp-socks>=0.11.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx[socks]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "configs"]
